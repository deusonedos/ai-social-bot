<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>AI Social Bot</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 16px/1.6 system-ui, -apple-system, sans-serif;
        background: Canvas;
        color: CanvasText;
      }
      main { max-width: 32rem; padding: 2rem; text-align: center; }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { margin: 0.25rem 0; opacity: 0.7; font-size: 0.9rem; }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.85em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AI Social Bot</h1>
      <p>Бэкенд работает. Здесь смотреть нечего — бот живёт в Telegram.</p>
      <p>Вебхук: <code>/api/telegram</code></p>
    </main>
  </body>
</html>
